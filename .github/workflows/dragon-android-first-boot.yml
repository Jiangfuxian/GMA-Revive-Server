name: Dragon Android first-boot download test

on:
  push:
    paths:
      - ".github/workflows/dragon-android-first-boot.yml"
  workflow_dispatch:
    inputs:
      apk_url:
        description: "Public direct HTTPS URL for the game APK, optional if using uploaded Drive APK"
        required: false
        type: string
      wait_minutes:
        description: "Minutes to leave the game open for data download (1-20)"
        required: false
        default: "8"
        type: string

permissions:
  contents: read

jobs:
  install-run-download:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Enable KVM permissions
        shell: bash
        run: |
          mkdir -p output
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm | tee output/kvm.txt
          test -w /dev/kvm

      - name: Download and check APK
        shell: bash
        env:
          APK_URL_INPUT: ${{ inputs.apk_url }}
          APK_URL_DEFAULT: https://drive.usercontent.google.com/download?id=17gVmYTHXvJHBAX7IR6fruTDbihh8I49V&export=download&confirm=t
        run: |
          set -euo pipefail
          mkdir -p work output
          APK_URL="${APK_URL_INPUT:-$APK_URL_DEFAULT}"
          curl --fail --location --retry 3 --retry-delay 3 --connect-timeout 30 --max-time 1800 "$APK_URL" -o work/dragon.apk
          test "$(stat -c%s work/dragon.apk)" -eq 900767097
          echo "f48eee0b4d547349c7e8d5dc158fa3cf432e5510c3155d7aef0b599b358245e1  work/dragon.apk" | sha256sum -c -
          unzip -t work/dragon.apk >/dev/null
          echo "APK download and ZIP integrity OK" | tee output/apk-check.txt

      - name: Run Android 35 emulator and start Dragon
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 20
        env:
          WAIT_MINUTES_INPUT: ${{ inputs.wait_minutes }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          disk-size: 8G
          emulator-boot-timeout: 240
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/ci_dragon_emulator.sh

      - name: Collect emulator and game diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p output
          timeout 20s adb devices -l > output/adb-status.txt 2>&1 || true
          timeout 25s adb logcat -d -v threadtime > output/logcat.txt 2>&1 || true
          timeout 20s adb shell dumpsys activity activities > output/activity.txt 2>&1 || true
          timeout 20s adb shell 'for p in /sdcard/Android/data/com.zulong.drc.mi /sdcard/Android/obb/com.zulong.drc.mi; do echo "$p"; du -ah "$p" 2>/dev/null | sort -h | tail -100; done' > output/downloaded-files-inventory.txt 2>&1 || true
          timeout 20s adb exec-out screencap -p > output/final-screen.png 2>/dev/null || true
          find output -type f -size +100M -delete

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dragon-android-emulator-report
          path: output/
          if-no-files-found: warn
          retention-days: 3
